name: Website build verification

on:
  pull_request:
    branches: [main, feature/admin-vault-intake-email-20261120]
  push:
    branches:
      - release/fix-build-reliability-2026-11
      - fix/portfolio-curator-persistence-2026-11-24
      - release/portfolio-curator-main-integration-2026-11-24

permissions:
  contents: read

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Portfolio deletion guard tests
        run: npm run test:portfolio-deletion-guard
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore security and curator workflow tests
        run: |
          cd tests/firestore
          npm install
          cp ../../firestore.rules ./firestore.rules
          npx firebase emulators:exec --only firestore --project bshomez-rules-test "npm test"
      - name: Build static website and SEO pages
        run: npm run build:pages
      - name: Verify generated production assets and location pages
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/CNAME || echo "CNAME is added by the production deployment workflow"
          test -n "$(find dist/assets -type f -name '*.js' -size +0c -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -size +0c -print -quit)"
          # Every location URL in the sitemap must have a real static HTML file.
          locations=(whitefield hoskote varthur gunjur hosa-road kasavanahalli off-sarjapur-road sarjapur electronic-city marathalli bellandur east-bangalore)
          for slug in "${locations[@]}"; do
            page="dist/locations/$slug/index.html"
            test -s "$page" || { echo "Missing generated location page: $page"; exit 1; }
            grep -Fq "<link rel=\"canonical\" href=\"https://bshomez.in/locations/$slug/\"" "$page" || { echo "Missing or incorrect canonical URL in $page"; exit 1; }
            grep -Fq "<loc>https://bshomez.in/locations/$slug/</loc>" dist/sitemap.xml || { echo "Location URL missing from sitemap: $slug"; exit 1; }
          done
          echo "Verified all 12 static location pages, canonical URLs, and sitemap entries."
