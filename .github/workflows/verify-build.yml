name: Website build verification

on:
  pull_request:
    branches: [main, feature/admin-vault-intake-email-20261120]
  push:
    branches:
      - release/fix-build-reliability-2026-11
      - fix/portfolio-curator-persistence-2026-11-24

permissions:
  contents: read

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: TypeScript validation
        run: npm run lint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore security and curator workflow tests
        run: |
          cd tests/firestore
          npm install
          cp ../../firestore.rules ./firestore.rules
          npx firebase emulators:exec --only firestore --project bshomez-rules-test "npm test"
      - name: Build static website and SEO pages
        run: npm run build:pages
      - name: Verify generated production assets
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/CNAME || echo "CNAME is added by the production deployment workflow"
          test -n "$(find dist/assets -type f -name '*.js' -size +0c -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -size +0c -print -quit)"
