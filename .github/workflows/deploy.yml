
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build:pages

      - name: Verify production build and all SEO location pages
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -size +0c -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -size +0c -print -quit)"
          # Every location URL in the sitemap must have a real static HTML file.
          locations=(whitefield hoskote varthur gunjur hosa-road kasavanahalli off-sarjapur-road sarjapur electronic-city marathalli bellandur east-bangalore)
          for slug in "${locations[@]}"; do
            page="dist/locations/$slug/index.html"
            test -s "$page" || { echo "Missing generated location page: $page"; exit 1; }
            grep -Fq "<link rel=\"canonical\" href=\"https://bshomez.in/locations/$slug/\"" "$page" || { echo "Missing or incorrect canonical URL in $page"; exit 1; }
            grep -Fq "<loc>https://bshomez.in/locations/$slug/</loc>" dist/sitemap.xml || { echo "Location URL missing from sitemap: $slug"; exit 1; }
          done
          echo "Verified all 12 static location pages, canonical URLs, and sitemap entries."
          cp dist/index.html dist/404.html
          echo "bshomez.in" > dist/CNAME
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Remove prior same-run artifacts before upload so workflow reruns cannot
      # leave duplicate github-pages artifacts for deploy-pages to discover.
      - name: Remove stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          if [ -n "$ids" ]; then
            while IFS= read -r id; do
              [ -z "$id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            done <<< "$ids"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # Give the artifact metadata API time to expose the newly uploaded artifact.
      - name: Wait for Pages artifact indexing
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
