name: Verify Firestore Security Rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firestore-rules.yml'
      - 'tests/firestore/**'
      - '.github/workflows/verify-firestore-rules.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firestore-rules.yml'
      - 'tests/firestore/**'
      - '.github/workflows/verify-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firestore rules test dependencies
        working-directory: tests/firestore
        run: npm install --no-audit --no-fund

      - name: Copy production rules into emulator project
        working-directory: tests/firestore
        run: cp ../../firestore.rules firestore.rules

      - name: Verify production deployment target
        run: |
          node -e "const c=require('./firebase-applet-config.json'); const f=require('./firebase.json'); const r=f.firestore.find(x=>x.database===c.firestoreDatabaseId); if(c.projectId!=='smartbiz-26213'||!r||r.rules!=='firestore.rules') process.exit(1); console.log('Verified Firestore deployment target:', c.projectId, c.firestoreDatabaseId);"
      - name: Run Firestore rules tests in emulator
        working-directory: tests/firestore
        run: npx firebase emulators:exec --only firestore --project demo-bshomez-rules-test "npm test"
