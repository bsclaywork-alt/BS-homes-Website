name: Deploy Firestore Rules (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the tested rules to the production Firestore database
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules regression tests
        working-directory: tests/firestore
        run: |
          npm install --no-audit --no-fund
          cp ../../firestore.rules firestore.rules
          npx firebase emulators:exec --only firestore --project demo-bshomez-rules-test "npm test"

      - name: Validate Workload Identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::Set the GCP_WORKLOAD_IDENTITY_PROVIDER repository variable."; exit 1; }
          test -n "$DEPLOYER_SERVICE_ACCOUNT" || { echo "::error::Set the GCP_SERVICE_ACCOUNT repository variable."; exit 1; }
          echo "Workload Identity configuration is present."

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify target project and database
        run: |
          node -e "const c=require('./firebase-applet-config.json'); if(c.projectId!=='smartbiz-26213'||c.firestoreDatabaseId!=='ai-studio-803a5529-5181-465b-9588-692caecb00ba') process.exit(1); console.log('Verified production Firestore target:', c.projectId, c.firestoreDatabaseId);"

      - name: Deploy Firestore rules through the Firebase Rules REST API
        env:
          PROJECT_ID: smartbiz-26213
          PROJECT_NUMBER: '893174739257'
          DATABASE_ID: ai-studio-803a5529-5181-465b-9588-692caecb00ba
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          export FIREBASE_RULES_ACCESS_TOKEN="$ACCESS_TOKEN"
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const project = process.env.PROJECT_ID;
          const projectNumber = process.env.PROJECT_NUMBER;
          const database = process.env.DATABASE_ID;
          const token = process.env.FIREBASE_RULES_ACCESS_TOKEN;
          const source = fs.readFileSync("firestore.rules", "utf8");
          const fingerprint = crypto.createHash("sha256").update(source, "utf8").digest("base64");
          const api = "https://firebaserules.googleapis.com/v1";
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };

          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(`Firebase Rules API ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          (async () => {
            const ruleset = await request(`${api}/projects/${project}/rulesets`, {
              method: "POST",
              body: JSON.stringify({
                attachmentPoint: `firestore.googleapis.com/projects/${projectNumber}/databases/${database}`,
                source: {
                  files: [{ name: "firestore.rules", content: source, fingerprint }],
                },
              }),
            });
            if (!ruleset.name) throw new Error("Rules API did not return a ruleset name.");

            const releaseName = `projects/${project}/releases/cloud.firestore/${database}`;
            const releaseUrl = `${api}/projects/${project}/releases/cloud.firestore/${database}`;
            const releaseBody = { release: { name: releaseName, rulesetName: ruleset.name } };

            let release;
            const update = await fetch(`${releaseUrl}?updateMask=rulesetName`, {
              method: "PATCH",
              headers,
              body: JSON.stringify(releaseBody),
            });
            if (update.status === 404) {
              release = await request(`${api}/projects/${project}/releases`, {
                method: "POST",
                body: JSON.stringify({ name: releaseName, rulesetName: ruleset.name }),
              });
            } else {
              const body = await update.json().catch(() => ({}));
              if (!update.ok) throw new Error(`Firebase Rules release update ${update.status}: ${JSON.stringify(body)}`);
              release = body;
            }

            const verified = await request(releaseUrl);
            if (verified.rulesetName !== ruleset.name) {
              throw new Error("Release verification failed: active release does not reference the newly created ruleset.");
            }
            console.log("Firestore rules successfully published and verified.");
            console.log("Database:", database);
            console.log("Release:", verified.name);
            console.log("Ruleset:", verified.rulesetName);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
