name: Firestore Rules Security Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches:
      - main
      - 'security/**'
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase-tools@latest @firebase/rules-unit-testing@latest firebase@12.13.0
      - name: Run Firestore emulator security tests
        run: npx firebase emulators:exec --only firestore --project demo-bshomez-firestore-security --config firebase.rules-test.json "node --test tests/firestore.rules.test.mjs"
