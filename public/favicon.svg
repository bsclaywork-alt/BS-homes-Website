<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark Luxury Background Tile -->
  <rect width="100" height="100" rx="20" fill="#0c0c0c"/>
  <rect width="96" height="96" x="2" y="2" rx="19" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Red Roof Landmark -->
  <path 
    d="M 18,36 L 46,12 L 56,21 L 56,15 L 62,15 L 62,26 L 71,36 L 86,36 L 86,40 L 72,40 L 46,17 L 21,36 Z" 
    fill="#E32526" 
  />

  <!-- Bold BS Lettering -->
  <text 
    x="12" 
    y="66" 
    fill="#FFFFFF" 
    font-size="28" 
    font-weight="900" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    letter-spacing="-0.02em"
  >
    BS
  </text>

  <!-- Graphic House-H Emblem -->
  <g>
    <!-- Left red pillar -->
    <rect x="52" y="43" width="5" height="23" fill="#E32526" rx="0.5"/>
    <!-- Right red pillar -->
    <rect x="64" y="43" width="5" height="23" fill="#E32526" rx="0.5"/>
    <!-- Crossbar -->
    <rect x="57" y="52" width="7" height="5" fill="#E32526"/>
    <!-- Gold upward compass arrow -->
    <path d="M 57,52 L 60.5,45 L 64,52 Z" fill="#C5A059"/>
  </g>

  <!-- Graphic O Letter with Concentric Gold Center -->
  <g>
    <circle cx="79" cy="54.5" r="8" fill="none" stroke="#FFFFFF" stroke-width="4.2"/>
    <circle cx="79" cy="54.5" r="2.2" fill="#C5A059"/>
  </g>

  <!-- Gold Dividing Bar -->
  <line x1="12" y1="73" x2="88" y2="73" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Emerald Green Tagline Bar -->
  <rect x="12" y="78" width="76" height="2.5" fill="#00A859" rx="1.2"/>
</svg>
